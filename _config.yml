title: ScamShield.gov.sg
url: https://scamshield.gov.sg
favicon: /images/favicon.png
colors:
  primary-color: "#2d81ff"
  secondary-color: "#005dea"
  media-colors:
    - title: media-color-one
      color: "#040033"
    - title: media-color-two
      color: "#230247"
    - title: media-color-three
      color: "#5a0024"
    - title: media-color-four
      color: "#f4c829"
    - title: media-color-five
      color: "#024325"
description: Government directory for scam-related information
permalink: none
baseurl: ""
exclude:
  - travis-script.js
  - .travis.yml
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
include:
  - _redirects
defaults:
  - scope:
      path: ""
    values:
      layout: page
custom_css_path: /misc/custom.css
custom_print_css_path: /assets/css/print.css
paginate: 12
remote_theme: isomerpages/isomerpages-template@next-gen
safe: false
plugins:
  - jekyll-feed
  - jekyll-assets
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme
staging: https://staging.d3marpr8819iq.amplifyapp.com
prod: https://master.d3marpr8819iq.amplifyapp.com
facebook-pixel: ""
shareicon: /images/Logo.png
is_government: true
google_analytics_ga4: ""
linkedin-insights: ""
resources_name: trends-and-updates
